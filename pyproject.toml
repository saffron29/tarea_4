[project]
name = "tarea-4"
version = "0.1.0"
description = "Agente de investigación socioeconómica: MCP del BCRP y Skills de la ENAHO 2024"
readme = "README.md"
authors = [
    { name = "Frank Pinares", email = "102867236+saffron29@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4,<5",
    "geopandas>=1.2.0",
    "httpx",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["mcp"]
